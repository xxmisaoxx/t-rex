name: Ghidra integration

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "examples/retry-policy/**"
      - ".github/workflows/ghidra.yml"
  pull_request:
    paths:
      - "skills/**"
      - "examples/retry-policy/**"
      - ".github/workflows/ghidra.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download and verify pinned official Ghidra
        shell: python
        run: |
          import hashlib, os, pathlib, urllib.request, zipfile
          tools = pathlib.Path(os.environ['RUNNER_TEMP']) / 'trex-tools'
          tools.mkdir()
          archive = tools / 'ghidra.zip'
          urllib.request.urlretrieve('https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip', archive)
          digest = hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest()
          assert digest == 'ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db', digest
          with zipfile.ZipFile(archive) as z:
              z.extractall(tools)
          home = tools / 'ghidra_12.1.4_PUBLIC'
          if os.name != 'nt':
              for p in home.rglob('*'):
                  if p.is_file() and (p.parent.name == 'support' or '/os/' in p.as_posix()):
                      p.chmod(p.stat().st_mode | 0o111)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('GHIDRA_HOME=' + str(home) + '\n')
      - name: Run real headless analysis and cached queries
        run: python skills/reverse-engineering-investigator/scripts/test_tools.py -v
